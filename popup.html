<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 220px;
      background: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      padding: 16px;
    }

    h2 {
      font-size: 13px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .label {
      font-size: 14px;
      color: #eee;
    }

    /* Toggle switch */
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .switch input { display: none; }
    .slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #00cc44; }
    input:checked + .slider::before { transform: translateX(20px); }

    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: #555;
      line-height: 1.5;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #00ff55;
      box-shadow: 0 0 6px #00ff55;
      display: inline-block;
      margin-right: 6px;
    }
    .dot.off { background: #444; box-shadow: none; }
  </style>
</head>
<body>
  <h2>🎞 Scanline Filter</h2>

  <div class="row">
    <span class="label">
      <span class="dot" id="dot"></span>Фильтр
    </span>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <p class="hint">
    Применяется к видео на YouTube.<br>
    Эффекты: grayscale + зелёные полосы + зелёная заливка снизу.
  </p>

  <script src="popup.js"></script>
</body>
</html>
